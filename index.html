<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Невозможный тест 2.0 для Аполлона</title>
<style>
  :root{--bg:#0f0f1a;--accent:#00ffb3;--danger:#ff3b5c;--text:#f2f2f7}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at top,#252545,#0b0b12 60%);
    color:var(--text);font-family:ui-monospace,"Courier New",monospace;
    display:grid;place-items:center;padding:12px;
    touch-action:manipulation;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{width:min(760px,100%);background:rgba(20,20,35,.94);border:1px solid #3c3c66;border-radius:18px;box-shadow:0 0 40px #00ffb322,inset 0 0 30px #00000066;padding:20px}
  h1{font-size:clamp(18px,4vw,28px);letter-spacing:1px;text-align:center;margin:0 0 6px;color:var(--accent);text-shadow:0 0 14px #00ffb388}
  #progress{text-align:center;color:#9a9ab0;font-size:13px;margin-bottom:16px}
  #stage{min-height:260px;display:flex;flex-direction:column;gap:14px;justify-content:center}
  h2{font-size:clamp(17px,3.5vw,22px);line-height:1.35;text-align:center;margin:0 0 6px}
  button{
    cursor:pointer;border:1px solid #4a4a7a;
    background:linear-gradient(#2b2b4d,#1f1f38);
    color:var(--text);padding:16px 20px;border-radius:14px;
    font:inherit;font-size:16px;transition:.15s;
    box-shadow:0 4px 0 #0b0b12;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:translateY(2px);box-shadow:0 2px 0 #0b0b12}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .secret{cursor:pointer;color:var(--accent)}
  .big{font-size:1.6rem;padding:24px}
  .red{background:#ff2448;border-color:#ff6b83;color:#fff}
  .blue{background:#246bff;border-color:#6b9bff;color:#fff}
  .green{background:#00b84d;border-color:#00ffb3;color:#fff}
  input{
    width:100%;padding:16px;border-radius:14px;
    border:1px solid #4a4a7a;background:#10101d;color:var(--text);
    font:inherit;font-size:18px;text-align:center;outline:none;
    -webkit-appearance:none;
  }
  input:focus{border-color:var(--accent)}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:#888;font-size:12px}
  .toggle{cursor:pointer;background:none;border:none;color:#aaa;padding:4px;box-shadow:none}
  .small{font-size:12px;color:#888;text-align:center}
  .counter{text-align:center;font-size:28px;font-weight:bold;color:var(--accent);letter-spacing:2px;margin:8px 0;text-shadow:0 0 12px #00ffb366}
  .dodge-counter{position:absolute;top:8px;right:12px;font-size:13px;color:#8a8aac;z-index:10;pointer-events:none}
  @keyframes grow{from{transform:scale(1)}to{transform:scale(1.8)}}
  @keyframes shrink{from{transform:scale(1)}to{transform:scale(0)}}
  @keyframes slideLR{0%,100%{left:5%}50%{left:60%}}
  .fail-screen{text-align:center;padding:30px 10px}
  .fail-screen .big-x{font-size:44px;color:#ff3b5c;font-weight:bold;letter-spacing:4px;text-shadow:0 0 20px #ff3b5c88}
  .fail-screen .sub{font-size:13px;color:#888;margin-top:10px;letter-spacing:1px}
  #err{white-space:pre-wrap;color:#ffb3c0;background:#2a0e14;border:1px solid #ff3b5c;padding:14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div id="app">
  <div id="err"></div>
  <h1 id="title">НЕВОЗМОЖНЫЙ ТЕСТ 2.0 ДЛЯ АПОЛЛОНА</h1>
  <div id="progress"></div>
  <main id="stage"></main>
  <div class="footer">
    <span style="color:#ff3b5c">Ошибка — всё сначала.</span>
    <button class="toggle" id="soundBtn">Звук: вкл</button>
  </div>
</div>

<script>
window.onerror = function(msg, src, line, col, err){
  var e = document.getElementById("err");
  e.style.display = "block";
  e.textContent = "ОШИБКА JS:\n" + msg + "\nСтрока " + line + ":" + col + "\n\n" + (err && err.stack ? err.stack : "");
};

try {
  var stage = document.getElementById("stage");
  var progress = document.getElementById("progress");
  var titleEl = document.getElementById("title");
  var soundBtn = document.getElementById("soundBtn");

  var current = 0, answered = false, soundOn = true, audioCtx = null;
  var activeTimers = [];

  function addTimer(id){ activeTimers.push(id); return id; }
  function clearAllTimers(){
    activeTimers.forEach(function(id){ clearInterval(id); clearTimeout(id); });
    activeTimers = [];
  }

  function initAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep(freq, dur, type, vol, delay){
    freq = freq || 440; dur = dur || 0.1; type = type || "sine"; vol = vol || 0.08; delay = delay || 0;
    if(!soundOn) return;
    try{ initAudio(); } catch(e){ return; }
    var t = audioCtx.currentTime + delay;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sfx = {
    click: function(){ beep(520, 0.06, "square", 0.04); },
    correct: function(){ beep(660, 0.09, "sine", 0.08); beep(990, 0.12, "sine", 0.08, 0.1); },
    wrong: function(){ beep(160, 0.18, "sawtooth", 0.09); beep(120, 0.22, "sawtooth", 0.08, 0.12); },
    win: function(){ [523,659,784,1047].forEach(function(f,i){ beep(f, 0.18, "triangle", 0.08, i*0.14); }); }
  };

  function makeBtn(text, onClick, cls){
    var b = document.createElement("button");
    b.innerHTML = text;
    if(cls) b.className = cls;
    b.addEventListener("click", function(e){
      e.stopPropagation();
      sfx.click();
      onClick(e, b);
    });
    return b;
  }
  function makeTitle(html){
    var h = document.createElement("h2");
    h.innerHTML = html;
    stage.append(h);
    return h;
  }
  function softWrong(){
    // для таймеров/счётчиков — только звук, без рестарта
    sfx.wrong();
  }
  function fail(){
    // полный рестарт с первого вопроса
    if(answered) return;
    answered = true;
    sfx.wrong();
    clearAllTimers();
    stage.innerHTML = "";
    var box = document.createElement("div");
    box.className = "fail-screen";
    box.innerHTML = '<div class="big-x">ОШИБКА</div>' +
                    '<div class="sub">всё сначала... вопрос 1 из 30</div>';
    stage.append(box);
    setTimeout(function(){
      current = 0;
      answered = false;
      renderQuestion();
    }, 1300);
  }
  function softRestart(){
    // перезапуск только текущего задания (для таймеров)
    if(answered) return;
    clearAllTimers();
    stage.innerHTML = "";
    titleEl.textContent = "НЕВОЗМОЖНЫЙ ТЕСТ 2.0 ДЛЯ АПОЛЛОНА";
    progress.textContent = "Вопрос " + (current + 1) + " из " + questions.length;
    questions[current].render();
  }
  function next(){
    if(answered) return;
    answered = true;
    sfx.correct();
    current++;
    clearAllTimers();
    setTimeout(renderQuestion, 350);
  }

  var questions = [
    // 1
    {
      render: function(){
        makeTitle('Нажми на кнопку «Я не кнопка».');
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("Кнопка", fail));
        g.append(makeBtn("Я не кнопка", next));
        g.append(makeBtn("Тоже кнопка", fail));
        stage.append(g);
      }
    },
    // 2
    {
      render: function(){
        makeTitle('Нажми на кнопку, которая говорит «НЕ НАЖИМАЙ».');
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("НАЖМИ", fail));
        g.append(makeBtn("НЕ НАЖИМАЙ", next));
        g.append(makeBtn("ЖМИ", fail));
        stage.append(g);
      }
    },
    // 3
    {
      render: function(){
        var h = makeTitle('Тапни на слово «небо» в этом предложении.');
        var s = document.createElement("div"); s.className = "small";
        s.innerHTML = 'Сегодня <span class="secret" id="sky">небо</span> особенно хмурое и красивое одновременно.';
        stage.append(s);
        s.querySelector("#sky").addEventListener("click", function(e){ e.stopPropagation(); next(); });
      }
    },
    // 4 — таймер: нажал раньше = soft wrong (не рестарт)
    {
      render: function(){
        makeTitle("Нажми на кнопку через 3 секунды. Не раньше.");
        var canTap = false;
        var c = document.createElement("div"); c.className = "counter"; c.textContent = "3";
        stage.append(c);
        var count = 3;
        var iv = setInterval(function(){
          count--;
          if(count <= 0){ clearInterval(iv); c.textContent = "ЖМИ!"; canTap = true; return; }
          c.textContent = count;
        }, 1000);
        addTimer(iv);
        stage.append(makeBtn("ЖМИ", function(){
          if(canTap) next(); else softWrong();
        }, "big"));
      }
    },
    // 5 — порядок: ошибка = рестарт
    {
      render: function(){
        makeTitle("Нажми в порядке: КРАСНАЯ → СИНЯЯ → ЗЕЛЁНАЯ");
        var order = ["red","blue","green"];
        var idx = 0;
        var g = document.createElement("div"); g.className = "grid";
        ["red","blue","green"].forEach(function(color){
          var label = color === "red" ? "КРАСНАЯ" : color === "blue" ? "СИНЯЯ" : "ЗЕЛЁНАЯ";
          g.append(makeBtn(label, function(e, btn){
            if(color === order[idx]){
              btn.style.opacity = "0.4";
              idx++;
              if(idx >= order.length) next();
            } else {
              fail();
            }
          }, color));
        });
        stage.append(g);
      }
    },
    // 6 — точка: большая = рестарт
    {
      render: function(){
        makeTitle("Нажми на маленькую красную точку.");
        var arena = document.createElement("div");
        arena.style.cssText = "position:relative;height:200px;border:1px dashed #4a4a7a;border-radius:14px;background:#10101d;overflow:hidden";
        stage.append(arena);
        var big = document.createElement("div");
        big.style.cssText = "position:absolute;width:70px;height:70px;background:#ff2448;border-radius:50%;left:20%;top:30%;cursor:pointer";
        big.addEventListener("click", fail);
        arena.append(big);
        var small = document.createElement("div");
        small.style.cssText = "position:absolute;width:18px;height:18px;background:#ff2448;border-radius:50%;left:70%;top:60%;cursor:pointer";
        small.addEventListener("click", next);
        arena.append(small);
      }
    },
    // 7 — зажми: отпустил раньше = просто сброс (таймер)
    {
      render: function(){
        makeTitle("Зажми кнопку и держи 2 секунды.");
        var btn = document.createElement("button");
        btn.textContent = "ДЕРЖИ МЕНЯ";
        btn.className = "big";
        stage.append(btn);
        var timer = null;
        var done = false;
        function start(e){
          if(e && e.preventDefault) e.preventDefault();
          if(done) return;
          btn.textContent = "ДЕРЖИ...";
          timer = setTimeout(function(){
            done = true;
            btn.textContent = "МОЛОДЕЦ";
            next();
          }, 2000);
        }
        function cancel(){
          if(timer){ clearTimeout(timer); timer = null; if(!done) btn.textContent = "ДЕРЖИ МЕНЯ"; }
        }
        btn.addEventListener("touchstart", start, {passive:false});
        btn.addEventListener("touchend", cancel);
        btn.addEventListener("mousedown", start);
        btn.addEventListener("mouseup", cancel);
        btn.addEventListener("mouseleave", cancel);
      }
    },
    // 8 — ввод: неверно = рестарт
    {
      render: function(){
        makeTitle("Напечатай слово АПОЛЛОН заглавными буквами.");
        var inp = document.createElement("input");
        inp.placeholder = "АПОЛЛОН";
        inp.setAttribute("autocapitalize","characters");
        stage.append(inp);
        var check = function(){
          if(inp.value === "АПОЛЛОН") next(); else fail();
        };
        inp.addEventListener("keydown", function(e){ if(e.key === "Enter") check(); });
        stage.append(makeBtn("ПРОВЕРИТЬ", check));
      }
    },
    // 9 — 7 кликов за 3 сек: не успел = soft restart задания
    {
      render: function(){
        makeTitle("Нажми 7 раз за 3 секунды.");
        var count = 0, failed = false;
        var c = document.createElement("div"); c.className = "counter"; c.textContent = "0 / 7";
        stage.append(c);
        var t = document.createElement("div"); t.className = "small"; t.textContent = "осталось: 3.0 сек";
        stage.append(t);
        var timeLeft = 3000;
        var iv = setInterval(function(){
          timeLeft -= 100;
          t.textContent = "осталось: " + (timeLeft/1000).toFixed(1) + " сек";
          if(timeLeft <= 0){
            clearInterval(iv);
            if(count < 7){
              failed = true;
              t.textContent = "ВРЕМЯ ВЫШЛО — заново";
              sfx.wrong();
              setTimeout(softRestart, 800);
            }
          }
        }, 100);
        addTimer(iv);
        stage.append(makeBtn("ЖМИ", function(){
          if(failed) return;
          count++;
          c.textContent = count + " / 7";
          if(count >= 7){ clearInterval(iv); next(); }
        }, "big"));
      }
    },
    // 10 — невидимая кнопка: клик мимо = рестарт
    {
      render: function(){
        makeTitle("Найди и нажми на кнопку в этом поле.");
        var arena = document.createElement("div");
        arena.style.cssText = "position:relative;height:200px;border:1px dashed #4a4a7a;border-radius:14px;background:#10101d;overflow:hidden;cursor:crosshair";
        stage.append(arena);
        var hidden = document.createElement("button");
        hidden.textContent = "ТУТ";
        hidden.style.cssText = "position:absolute;opacity:0.08;padding:10px 14px;font-size:14px;left:47%;top:53%;box-shadow:none;border:none";
        hidden.addEventListener("click", function(e){ e.stopPropagation(); next(); });
        arena.append(hidden);
        arena.addEventListener("click", function(e){
          if(e.target === arena) fail();
        });
      }
    },
    // 11 — меньшая кнопка: не та = рестарт
    {
      render: function(){
        makeTitle("Нажми на меньшую кнопку.");
        var g = document.createElement("div"); g.className = "grid";
        var big = makeBtn("БОЛЬШАЯ", fail);
        big.style.padding = "24px 32px";
        big.style.fontSize = "20px";
        g.append(big);
        var small = makeBtn("маленькая", next);
        small.style.padding = "8px 12px";
        small.style.fontSize = "12px";
        g.append(small);
        stage.append(g);
      }
    },
    // 12 — цвет: не зелёный = soft wrong (таймер)
    {
      render: function(){
        makeTitle("Нажми на кнопку, когда она станет ЗЕЛЁНОЙ.");
        var btn = makeBtn("ЖДИ", function(){ softWrong(); }, "big");
        stage.append(btn);
        var colors = ["#2b2b4d","#246bff","#ff2448","#ffb300","#00b84d"];
        var idx = 0, isGreen = false;
        var iv = setInterval(function(){
          idx = (idx + 1) % colors.length;
          btn.style.background = colors[idx];
          isGreen = (colors[idx] === "#00b84d");
        }, 700);
        addTimer(iv);
        btn.addEventListener("click", function(e){
          e.stopPropagation();
          if(isGreen){
            clearInterval(iv);
            next();
          } else {
            softWrong();
          }
        });
      }
    },
    // 13 — отличается: не та = рестарт
    {
      render: function(){
        makeTitle("Какая кнопка отличается? Нажми на неё.");
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("⬤", fail));
        g.append(makeBtn("⬤", fail));
        g.append(makeBtn("○", next));
        g.append(makeBtn("⬤", fail));
        stage.append(g);
      }
    },
    // 14 — несуществующая: клик по слову
    {
      render: function(){
        var h = makeTitle('Нажми на <span class="secret" id="nx">несуществующую</span> кнопку.');
        h.querySelector("#nx").addEventListener("click", function(e){ e.stopPropagation(); next(); });
        var s = document.createElement("div"); s.className = "small";
        s.textContent = "В этом поле нет никаких кнопок.";
        stage.append(s);
      }
    },
    // 15 — порядок 3→2→1: ошибка = рестарт
    {
      render: function(){
        makeTitle("Нажми в порядке: 3 → 2 → 1");
        var seq = [], order = [3,2,1];
        var g = document.createElement("div"); g.className = "grid";
        [1,2,3].forEach(function(n){
          var btn = makeBtn(String(n), function(e, b){
            if(n === order[seq.length]){
              seq.push(n);
              b.style.opacity = "0.4";
              if(seq.length === order.length) next();
            } else {
              fail();
            }
          });
          g.append(btn);
        });
        stage.append(g);
      }
    },
    // 16 — мод: неверно = рестарт
    {
      render: function(){
        makeTitle('Прочитай наоборот: «мод». Что это за слово?');
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("мод", fail));
        g.append(makeBtn("дом", next));
        g.append(makeBtn("ком", fail));
        g.append(makeBtn("лом", fail));
        stage.append(g);
      }
    },
    // 17 — лишнее emoji: не то = рестарт
    {
      render: function(){
        makeTitle("Найди лишнее и нажми на него.");
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("🐶", fail));
        g.append(makeBtn("🐶", fail));
        g.append(makeBtn("🐨", next));
        g.append(makeBtn("🐶", fail));
        stage.append(g);
      }
    },
    // 18 — зеркало: неверно = рестарт
    {
      render: function(){
        makeTitle('Напечатай слово «зеркало» наоборот.');
        var inp = document.createElement("input");
        inp.placeholder = "наоборот";
        stage.append(inp);
        var check = function(){
          if(inp.value.trim().toLowerCase() === "олакрез") next(); else fail();
        };
        inp.addEventListener("keydown", function(e){ if(e.key === "Enter") check(); });
        stage.append(makeBtn("ПРОВЕРИТЬ", check));
      }
    },
    // 19 — все гласные: согласная = рестарт
    {
      render: function(){
        makeTitle("Нажми на все гласные буквы в слове АПОЛЛОН.");
        var sel = {};
        var g = document.createElement("div"); g.className = "grid";
        ["А","П","О","Л","Н"].forEach(function(letter){
          var isVowel = (letter === "А" || letter === "О");
          g.append(makeBtn(letter, function(e, btn){
            if(isVowel){
              if(!sel[letter]){
                sel[letter] = 1;
                btn.style.background = "#00b84d";
                btn.style.borderColor = "#00ffb3";
                if(Object.keys(sel).length === 2) next();
              }
            } else {
              fail();
            }
          }, "big"));
        });
        stage.append(g);
      }
    },
    // 20 — растущая: не та = рестарт
    {
      render: function(){
        makeTitle("Нажми на кнопку, которая растёт.");
        var g = document.createElement("div"); g.className = "grid";
        var grow = makeBtn("РАСТУ", next);
        grow.style.animation = "grow 2s infinite alternate";
        g.append(grow);
        g.append(makeBtn("Стою", fail));
        g.append(makeBtn("Сплю", fail));
        stage.append(g);
      }
    },
    // 21 — исчезающая: не та = рестарт; исчезла = soft restart
    {
      render: function(){
        makeTitle("Нажми на кнопку, пока она не исчезла.");
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("Стою", fail));
        var shrink = makeBtn("ИСЧЕЗАЮ", next);
        shrink.style.animation = "shrink 3s forwards";
        g.append(shrink);
        g.append(makeBtn("Тоже стою", fail));
        stage.append(g);
        var hideTimer = setTimeout(function(){
          if(!answered) softRestart();
        }, 3300);
        addTimer(hideTimer);
      }
    },
    // 22 — двойной тап: не успел = soft wrong (таймер)
    {
      render: function(){
        makeTitle("Нажми на кнопку дважды очень быстро.");
        var lastTap = 0;
        var btn = makeBtn("ЖМИ ДВАЖДЫ", function(){
          var now = Date.now();
          if(now - lastTap < 350){ next(); }
          else { softWrong(); }
          lastTap = now;
        }, "big");
        stage.append(btn);
      }
    },
    // 23 — движущаяся: промах = игнор (нужно попасть)
    {
      render: function(){
        makeTitle("Нажми на движущуюся кнопку.");
        var arena = document.createElement("div");
        arena.style.cssText = "position:relative;height:200px;border:1px dashed #4a4a7a;border-radius:14px;background:#10101d;overflow:hidden";
        stage.append(arena);
        var btn = makeBtn("ЛОВИ", next);
        btn.style.cssText = "position:absolute;top:45%;animation:slideLR 2s infinite;white-space:nowrap";
        btn.style.left = "5%";
        arena.append(btn);
      }
    },
    // 24 — ноль: не та = рестарт
    {
      render: function(){
        makeTitle("Нажми на кнопку, где написано слово «ноль».");
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("0", fail));
        g.append(makeBtn("ноль", next));
        g.append(makeBtn("нуль", fail));
        stage.append(g);
      }
    },
    // 25 — счётчик 5: не то число = soft wrong (таймер)
    {
      render: function(){
        makeTitle("Нажми на кнопку, когда счётчик покажет 5.");
        var c = document.createElement("div"); c.className = "counter"; c.textContent = "1";
        stage.append(c);
        var n = 1;
        var iv = setInterval(function(){
          n++;
          if(n > 5) n = 1;
          c.textContent = n;
        }, 700);
        addTimer(iv);
        stage.append(makeBtn("ЖМИ", function(){
          if(n === 5){ clearInterval(iv); next(); }
          else softWrong();
        }, "big"));
      }
    },
    // 26 — КОТ: не та буква = рестарт
    {
      render: function(){
        makeTitle("Собери слово КОТ: нажимай буквы по порядку.");
        var word = ["К","О","Т"];
        var idx = 0;
        var g = document.createElement("div"); g.className = "grid";
        ["К","О","М","Т","А"].forEach(function(letter){
          var btn = makeBtn(letter, function(e, b){
            if(letter === word[idx]){
              idx++;
              b.style.opacity = "0.4";
              if(idx >= word.length) next();
            } else {
              fail();
            }
          }, "big");
          g.append(btn);
        });
        stage.append(g);
      }
    },
    // 27 — пустая: не та = рестарт
    {
      render: function(){
        makeTitle("Нажми на пустую кнопку.");
        var g = document.createElement("div"); g.className = "grid";
        g.append(makeBtn("Текст", fail));
        g.append(makeBtn("&nbsp;", next));
        g.append(makeBtn("Ещё текст", fail));
        stage.append(g);
      }
    },
    // 28 — алфавит: не та = рестарт
    {
      render: function(){
        makeTitle("Нажми буквы в алфавитном порядке.");
        var order = ["А","Б","В"];
        var idx = 0;
        var g = document.createElement("div"); g.className = "grid";
        ["В","А","Б"].forEach(function(letter){
          var btn = makeBtn(letter, function(e, b){
            if(letter === order[idx]){
              idx++;
              b.style.opacity = "0.4";
              if(idx >= order.length) next();
            } else {
              fail();
            }
          }, "big");
          g.append(btn);
        });
        stage.append(g);
      }
    },
    // 29 — все О: не О = рестарт
    {
      render: function(){
        makeTitle("Нажми на все кнопки с буквой О.");
        var sel = {};
        var total = 3;
        var g = document.createElement("div"); g.className = "grid";
        ["А","О","И","О","У","О"].forEach(function(letter, i){
          var isO = (letter === "О");
          g.append(makeBtn(letter, function(e, b){
            if(isO){
              if(!sel[i]){
                sel[i] = 1;
                b.style.background = "#00b84d";
                b.style.borderColor = "#00ffb3";
                if(Object.keys(sel).length === total) next();
              }
            } else {
              fail();
            }
          }, "big"));
        });
        stage.append(g);
      }
    },
    // 30 — 200 попаданий: промах = игнор (счётчик)
    {
      render: function(){
        makeTitle("Нажми на кнопку 200 раз. Только точные попадания считаются.");
        var arena = document.createElement("div");
        arena.style.cssText = "position:relative;height:240px;border:1px dashed #4a4a7a;border-radius:14px;overflow:hidden;background:#10101d;touch-action:none";
        stage.append(arena);
        var counterEl = document.createElement("div");
        counterEl.className = "dodge-counter";
        counterEl.textContent = "0 / 200";
        arena.append(counterEl);
        var btn = document.createElement("button");
        btn.textContent = "ЖМИ";
        btn.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 22px;font-size:16px;white-space:nowrap;touch-action:none";
        arena.append(btn);

        var dodges = 0, MAX = 200, caught = false;

        function move(){
          var pad = 10;
          var bw = btn.offsetWidth, bh = btn.offsetHeight;
          var aw = arena.clientWidth, ah = arena.clientHeight;
          var maxX = Math.max(pad, aw - bw - pad);
          var maxY = Math.max(pad, ah - bh - pad);
          btn.style.left = (pad + Math.random() * (maxX - pad)) + "px";
          btn.style.top  = (pad + Math.random() * (maxY - pad)) + "px";
          btn.style.transform = "none";
        }

        var dodgeFired = false;
        function doHit(){
          if(caught) return;
          dodges++;
          counterEl.textContent = dodges + " / " + MAX;
          if(dodges >= MAX){
            caught = true;
            btn.textContent = "ПОЙМАЛ!";
            btn.style.left = "50%"; btn.style.top = "50%";
            btn.style.transform = "translate(-50%,-50%)";
            counterEl.textContent = "200 / 200 ✓";
            sfx.correct();
            setTimeout(next, 500);
            return;
          }
          move();
        }

        btn.addEventListener("touchstart", function(e){
          e.preventDefault();
          e.stopPropagation();
          dodgeFired = true;
          doHit();
          setTimeout(function(){ dodgeFired = false; }, 400);
        }, {passive:false});

        btn.addEventListener("click", function(e){
          e.stopPropagation();
          if(dodgeFired) return;
          doHit();
        });
      }
    }
  ];

  function showVictory(){
    titleEl.textContent = "ТЕСТ ПРОЙДЕН";
    progress.textContent = "";
    stage.innerHTML = "";
    sfx.win();
    makeTitle("Аполлон, ты выжил. 30 испытаний без единой ошибки.");
    var spoiler = document.createElement("div");
    spoiler.className = "small";
    spoiler.textContent = "Спойлер: всё было проходимо.";
    stage.append(spoiler);
    stage.append(makeBtn("Пройти заново", function(){
      current = 0; answered = false; clearAllTimers(); renderQuestion();
    }));
  }

  function renderQuestion(){
    clearAllTimers();
    if(current >= questions.length){ showVictory(); return; }
    answered = false;
    stage.innerHTML = "";
    titleEl.textContent = "НЕВОЗМОЖНЫЙ ТЕСТ 2.0 ДЛЯ АПОЛЛОНА";
    progress.textContent = "Вопрос " + (current + 1) + " из " + questions.length;
    questions[current].render();
  }

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "Звук: вкл" : "Звук: выкл";
    if(soundOn){ try{ initAudio(); } catch(e){} sfx.click(); }
  });

  renderQuestion();
} catch (e) {
  var el = document.getElementById("err");
  el.style.display = "block";
  el.textContent = "ОШИБКА ПРИ СТАРТЕ:\n" + (e && e.message ? e.message : e) + "\n\n" + (e && e.stack ? e.stack : "");
}
</script>
</body>
</html>
